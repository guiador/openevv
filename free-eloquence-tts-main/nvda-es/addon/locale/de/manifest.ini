summary = "OpenEVV — experimentelle erweiterte Sprachausgabe"
description = """OpenEVV für 64-Bit-NVDA: 64 Sprach- und Stimmkombinationen, Aussprachewörterbücher, Lese- und Satzzeichenoptionen, Equalizer, Stereobalance und WAV-Export. Experimentelle Breitband- und native 16-kHz-Synthese sowie Reaktionsoptionen. Oberfläche und Dokumentation auf Englisch, Spanisch, Deutsch, Französisch und Italienisch."""
