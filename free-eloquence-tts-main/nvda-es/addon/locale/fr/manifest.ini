summary = "OpenEVV — synthèse vocale enrichie expérimentale"
description = """OpenEVV pour NVDA 64 bits : 64 combinaisons de langue et de voix, dictionnaires de prononciation, réglages de lecture et de ponctuation, égaliseur, balance stéréo et export WAV. Synthèse large bande, base native de 16 kHz et réglages de réactivité expérimentaux. Interface et documentation en anglais, espagnol, allemand, français et italien."""
