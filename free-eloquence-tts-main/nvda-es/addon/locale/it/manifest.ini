summary = "OpenEVV — sintesi vocale estesa sperimentale"
description = """OpenEVV per NVDA a 64 bit: 64 combinazioni di lingua e voce, dizionari di pronuncia, controlli di lettura e punteggiatura, equalizzatore, bilanciamento stereo ed esportazione WAV. Sintesi a banda larga, base nativa a 16 kHz e impostazioni di reattività sperimentali. Interfaccia e documentazione in inglese, spagnolo, tedesco, francese e italiano."""
